<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NIGHTFALL</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #050608;
        color: #e6e6e6;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #ui-overlay {
        position: absolute;
        top: 20px;
        left: 24px;
        pointer-events: none;
        user-select: none;
        z-index: 10;
      }
      h1 {
        font-size: 2rem;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        font-weight: 700;
        color: rgba(220, 225, 230, 0.8);
        text-shadow: 0 0 16px rgba(0, 0, 0, 0.9);
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="ui-overlay">
        <h1>NIGHTFALL</h1>
      </div>
      <canvas id="game-canvas"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
